<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Find your connection</title>
    <script>
      // Colours and the board class are set before the first paint, so a TV
      // never flashes the wrong theme. ?theme=light|dark overrides the system
      // setting; the board (?display=1) is light unless told otherwise, since
      // TV boxes tend to report dark mode.
      ;(function () {
        var query = new URLSearchParams(location.search)
        var root = document.documentElement
        var display = query.has('display')
        var wanted = query.get('theme')
        var dark = window.matchMedia('(prefers-color-scheme: dark)')
        root.classList.toggle('display', display)
        function apply() {
          var theme = wanted === 'light' || wanted === 'dark' ? wanted : display ? 'light' : dark.matches ? 'dark' : 'light'
          root.setAttribute('data-theme', theme)
        }
        apply()
        if (dark.addEventListener) dark.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
